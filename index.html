<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quick Vibe Check ✨</title>
  
  <!-- OpenGraph / Social Meta Tags (for ultra-innocent link preview when sharing on WhatsApp, iMessage, etc.) -->
  <meta property="og:title" content="Quick Vibe Check ✨">
  <meta property="og:description" content="Take this 30-second aesthetic vibe check to see your aura & mood score today!">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fdf2f8">

  <!-- Aesthetic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Aesthetic Background Blobs -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Quiz Container -->
  <main id="quizCard" class="quiz-card" role="main">
    <!-- Header with badge and title -->
    <header class="card-header">
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Daily Aura • 30s</span>
      </div>
      <h1 class="main-title">Quick Vibe Check ✨</h1>
      <p class="main-subtitle">Answer 3 harmless questions to reveal your current vibe score.</p>
      
      <!-- Progress Bar -->
      <div class="progress-container" aria-label="Quiz progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="step-indicator" id="stepIndicator">Question 1 of 3</div>
    </header>

    <!-- Quiz Form -->
    <form id="quizForm" onsubmit="return false;" novalidate>
      <div class="question-container">
        <!-- Question Label (Dynamic font size & color) -->
        <label for="answerInput" id="questionLabel" class="question-text">
          Hey! Quick question... how was your day today? ☀️
        </label>
        
        <p id="questionHint" class="question-hint">
          Be honest, no wrong answers!
        </p>

        <!-- Input Field (strictly 16px font-size to prevent mobile browser auto-zoom) -->
        <div class="input-wrapper">
          <input 
            type="text" 
            id="answerInput" 
            name="answer"
            placeholder="Type your thoughts here..." 
            autocomplete="off" 
            autocorrect="off" 
            spellcheck="false"
            required
          >
          <span class="input-focus-border"></span>
        </div>
      </div>

      <!-- Footer Buttons -->
      <footer class="card-footer">
        <button type="submit" id="nextBtn" class="action-btn">
          <span id="btnText">Next</span>
          <svg class="btn-arrow" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </footer>
    </form>
  </main>

  <!-- Jumpscare Full-Screen Container -->
  <section id="scareContainer" class="scare-container" aria-hidden="true">
    <!-- Local HTML5 Video (zero latency, instant buffer) -->
    <video 
      id="scareVideo" 
      class="scare-media" 
      src="scare.mp4" 
      playsinline 
      webkit-playsinline 
      preload="auto">
    </video>

    <!-- YouTube IFrame Container Fallback / Alternative -->
    <div id="ytPlayerContainer" class="scare-media yt-wrapper hidden">
      <div id="ytPlayer"></div>
    </div>

    <!-- Screen Flash / Strobe Effect on scare trigger -->
    <div id="screenFlash" class="screen-flash"></div>
  </section>

  <!-- Post-Scare Floating Tease Pill -->
  <aside id="teaseOverlay" class="tease-overlay hidden" aria-live="polite">
    <div class="tease-card">
      <div class="tease-emoji">😈</div>
      <div class="tease-content">
        <h2 class="tease-title">Darr gayi na? 😛</h2>
        <p class="tease-subtitle">Your vibe check score is 100% terrified! Send this to your friends.</p>
      </div>
      <div class="tease-actions">
        <button id="replayBtn" class="tease-btn secondary" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 4v6h6M23 20v-6h-6"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
          Replay
        </button>
        <button id="shareBtn" class="tease-btn primary" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          Share Prank
        </button>
      </div>
    </div>
  </aside>

  <!-- Toast Notification for Share action -->
  <div id="toast" class="toast hidden" role="alert">Link copied to clipboard! Send it to your next victim 😈</div>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Main Application Script -->
  <script src="script.js"></script>
</body>
</html>
